{% extends 'base.html' %}

{% block content %}
<section class="text-center">
 <div class="p-5 bg-image" style="background-image: url('https://mdbootstrap.com/img/new/textures/full/171.jpg'); height: 300px;"></div>
 <div class="card mx-4 mx-md-5 shadow-5-strong" style="margin-top: -100px; background: hsla(0, 0%, 100%, 0.8); backdrop-filter: blur(30px);">
    <div class="card-body py-5 px-md-5">
      <div class="row d-flex justify-content-center">
        <div class="col-lg-8">
          <h2 class="fw-bold mb-5">Log In</h2>
          <form method="post">
            {% csrf_token %}
            <div class="form-outline mb-4">
              <input type="name" id="form3Example3" class="form-control" name="{{ form.username.html_name }}" placeholder="{{ form.username.label }}">
              <label class="form-label" for="form3Example3">{{ form.username.label }}</label>
            </div>
            <div class="form-outline mb-4">
              <input type="password" id="form3Example4" class="form-control" name="{{ form.password.html_name }}" placeholder="{{ form.password.label }}">
              <label class="form-label" for="form3Example4">{{ form.password.label }}</label>
            </div>
            <div class="d-flex justify-content-center">
              <button type="submit" class="btn btn-primary btn-block mb-4">Log In</button>
            </div>
          </form>
        </div>
      </div>
    </div>
 </div>
</section>
{% endblock %}
