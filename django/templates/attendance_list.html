{% extends 'base.html' %}

{% block content %}
<h2>Attend List</h2>
<div class="container">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Class Name</th>
                <th>Attend Date</th>
            
            </tr>
        </thead>
        <tbody>
            {% for attend in attendance %}
            <tr>
                <td>{{ attend.id }}</td>
                <td>{{ attend.student }}</td>
                <td>{{ attend.class_name }}</td>
                <td>{{ attend.attend_date }}</td>
               
           
                
            </tr>
            {% empty %}
            <tr>
                <td colspan="6">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
