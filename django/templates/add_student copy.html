{% extends 'base.html' %} {% block content %}
<h2>Add a new student</h2>
<div class="d-flex">

<form
  method="post"
  enctype="multipart/form-data"
  class="your-custom-form-class"
>
  {% csrf_token %}
  <p>
    <label for="id_name">Name:</label>
    <input type="text" name="name" maxlength="255" required="" id="id_name" />
  </p>

  <p>
    <label for="id_stage">Stage:</label>
    <input type="text" name="stage" maxlength="255" required="" id="id_stage" />
  </p>

  <p>
    <label for="id_class_name">Class name:</label>
    <select name="class_name" required="" id="id_class_name">
      <option value="" selected="">---------</option>

      <option value="1">chemiaa</option>
    </select>
  </p>

  <p>
    <label for="id_phone_number">Phone number:</label>
    <input
      type="text"
      name="phone_number"
      maxlength="255"
      required=""
      id="id_phone_number"
    />
  </p>

  <p>
    <label for="id_fingerprint_image">Fingerprint image:</label>
    <input
    type="file"
    name="fingerprint_image"
    accept="image/*"
    required=""
    id="id_fingerprint_image"
    onclick="get_scanned_image()"
   />
  </p>
  <a  class="btn btn-info" onclick="get_scanned_image()">scan FingerPrint</a>
  <button type="submit" class="btn btn-info">Add Student</button>
</form>

</div>
<script>
   hi=document.getElementById("hi")
function get_scanned_image() {
    var url = '/process-image'; // Adjust the URL as necessary
    
    fetch(url, {
        method: 'GET',
    })
    .then(response => response.json()) // Parse the response as JSON
    .then(data => {
      var imageUrl = data.scanned_image_url + '?refresh=' + new Date().getTime();
        document.getElementById('preview-image').src = imageUrl;    })
    .catch(error => console.error('Error:', error));
}
</script>
{% endblock %}
